name: AirGesture A2R1
on:
  workflow_dispatch:
  push:
    branches: [airgesture-a1]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare verified model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --max-time 120 https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task -o app/src/main/assets/hand_landmarker.task
          echo 'fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1  app/src/main/assets/hand_landmarker.task' | sha256sum -c -
          cp /usr/share/common-licenses/Apache-2.0 app/src/main/assets/MediaPipe-APACHE-2.0.txt
          cp README.md app/src/main/assets/NOTICE.txt
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/AirGesture-A2R1.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose output/AirGesture-A2R1.apk
          "$BT/aapt2" dump badging output/AirGesture-A2R1.apk > output/manifest.txt
          grep -F "package: name='dev.xpfh.airgesture'" output/manifest.txt
          if grep -E "uses-permission.*android.permission.(INTERNET|ACCESS_NETWORK_STATE)" output/manifest.txt; then exit 1; fi
          cp README.md output/
          cp /usr/share/common-licenses/Apache-2.0 output/MediaPipe-APACHE-2.0.txt
          git rev-parse HEAD > output/build-commit.txt
          (cd output && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: AirGesture-A2R1
          path: output/
          retention-days: 7
          if-no-files-found: error
